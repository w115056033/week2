<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek, modern personal dashboard showcasing personal identity and real-time live clock with customizable themes.">
  <title>Personal Dashboard & Live Clock</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="violet">
  <!-- Dynamic Ambient Glow Background Elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Noise Overlay for Texture -->
  <div class="noise-overlay"></div>

  <main class="dashboard-wrapper">
    <!-- Main Glass Card Container -->
    <div class="card glass-card">
      
      <!-- Top Bar: Status & Controls -->
      <header class="card-header">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span class="status-text" id="status-label">Live Clock</span>
        </div>

        <!-- Quick Theme Switcher & Fullscreen -->
        <div class="header-actions">
          <div class="theme-palette" aria-label="Color Themes">
            <button class="theme-btn active" data-color="violet" title="Cyber Violet" aria-label="Cyber Violet theme"></button>
            <button class="theme-btn" data-color="cyan" title="Aurora Cyan" aria-label="Aurora Cyan theme"></button>
            <button class="theme-btn" data-color="emerald" title="Neon Emerald" aria-label="Neon Emerald theme"></button>
            <button class="theme-btn" data-color="amber" title="Solar Amber" aria-label="Solar Amber theme"></button>
          </div>
          <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Profile Section: Avatar, Greeting, and Editable Name -->
      <section class="profile-section">
        <div class="avatar-container">
          <div class="avatar-ring"></div>
          <div class="avatar-glow"></div>
          <div class="avatar-initials" id="avatar-initials">AM</div>
        </div>

        <div class="profile-details">
          <div class="greeting-badge">
            <span class="greeting-icon" id="greeting-icon">✨</span>
            <span class="greeting-text" id="greeting-text">Welcome</span>
          </div>

          <div class="name-container">
            <h1 class="user-name" id="user-name" title="Click to edit name">Alex Morgan</h1>
            <button id="edit-name-btn" class="edit-btn" title="Edit your name" aria-label="Edit name">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </div>

          <p class="tagline" id="tagline">Personal Workspace &amp; Timepiece</p>
        </div>
      </section>

      <!-- Divider -->
      <div class="card-divider"></div>

      <!-- Live Clock Display Section -->
      <section class="clock-section" aria-live="polite">
        <div class="clock-display">
          <div class="digits-box">
            <span class="time-part" id="clock-hours">12</span>
            <span class="time-colon" id="colon-1">:</span>
            <span class="time-part" id="clock-minutes">00</span>
            <span class="time-seconds-group" id="seconds-wrapper">
              <span class="time-colon secondary-colon">:</span>
              <span class="time-part seconds-digit" id="clock-seconds">00</span>
            </span>
          </div>
          <div class="period-badge" id="period-badge">PM</div>
        </div>

        <!-- Date & Location Badges -->
        <div class="meta-row">
          <div class="meta-chip date-chip">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span id="date-display">Wednesday, Sep 16, 2026</span>
          </div>

          <div class="meta-chip tz-chip">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span id="timezone-display">UTC+8 • Asia/Shanghai</span>
          </div>
        </div>
      </section>

      <!-- Bottom Options & Toolbar -->
      <footer class="controls-footer">
        <div class="toggle-group">
          <button id="format-toggle-btn" class="pill-toggle" aria-pressed="false">
            <span class="toggle-icon">24H</span>
            <span class="toggle-label" id="format-label">12-Hour Format</span>
          </button>

          <button id="seconds-toggle-btn" class="pill-toggle active" aria-pressed="true">
            <span class="toggle-icon">SEC</span>
            <span class="toggle-label" id="seconds-label">Seconds Shown</span>
          </button>
        </div>

        <div class="footer-tip">
          <span>Tip: Click your name to customize it anytime</span>
        </div>
      </footer>
    </div>
  </main>

  <!-- Name Edit Modal Dialog -->
  <dialog id="name-modal" class="modal-dialog">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3>Customize Display Name</h3>
        <button id="modal-close-btn" class="close-btn" aria-label="Close modal">&times;</button>
      </div>
      <form id="name-form" method="dialog">
        <div class="input-group">
          <label for="name-input">Your Name</label>
          <input type="text" id="name-input" maxlength="40" placeholder="e.g. Alex Morgan" autocomplete="name" required />
        </div>
        <div class="modal-actions">
          <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="modal-save-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
